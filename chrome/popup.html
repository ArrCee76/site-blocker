<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      max-height: 480px;
      font-family: 'JetBrains Mono', monospace;
      background: #0e0e0e;
      color: #d0d0d0;
      overflow-y: auto;
    }

    .header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      background: #0e0e0e;
      z-index: 10;
    }

    .header-icon { font-size: 20px; }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header .count {
      margin-left: auto;
      font-size: 11px;
      color: #ff3b3b;
      background: rgba(255,59,59,0.1);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .add-bar {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-bottom: 1px solid #1a1a1a;
    }

    .add-bar input {
      flex: 1;
      background: #161616;
      border: 1px solid #252525;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-bar input:focus {
      border-color: #ff3b3b;
    }

    .add-bar input::placeholder {
      color: #444;
    }

    .add-bar button {
      background: #ff3b3b;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .add-bar button:hover {
      background: #e02020;
    }

    .site-list {
      list-style: none;
      padding: 6px 0;
    }

    .site-list li {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
      transition: background 0.15s;
    }

    .site-list li:hover {
      background: #141414;
    }

    .site-list .domain {
      flex: 1;
      font-size: 12px;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .site-list .dot {
      width: 6px;
      height: 6px;
      background: #ff3b3b;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .site-list .remove {
      background: none;
      border: none;
      color: #444;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.15s;
      font-family: inherit;
    }

    .site-list .remove:hover {
      color: #ff3b3b;
      background: rgba(255,59,59,0.1);
    }

    .empty {
      padding: 40px 18px;
      text-align: center;
      color: #333;
      font-size: 12px;
      line-height: 1.6;
    }

    .tip {
      padding: 12px 18px;
      border-top: 1px solid #1a1a1a;
      font-size: 10px;
      color: #383838;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🛡️</span>
    <h1>Site Blocker</h1>
    <span class="count" id="count">0</span>
  </div>

  <div class="add-bar">
    <input type="text" id="domainInput" placeholder="e.g. example.com" />
    <button id="addBtn">Block</button>
  </div>

  <ul class="site-list" id="siteList"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">
    No sites blocked yet.<br>Add one above or right-click any page.
  </div>

  <div class="tip">Right-click on any page → "Block this site"</div>

  <script src="popup.js"></script>
</body>
</html>
