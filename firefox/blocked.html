<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blocked</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 1;
      position: relative;
    }

    .shield {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #ff3b3b;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: #666;
      max-width: 400px;
      line-height: 1.6;
    }

    .bar {
      width: 60px;
      height: 3px;
      background: #ff3b3b;
      margin: 24px auto;
      border-radius: 2px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,59,59,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,59,59,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <div class="shield">🛡️</div>
    <h1>Site Blocked</h1>
    <div class="bar"></div>
    <p>This site is on your blocklist. You can manage blocked sites through the extension popup.</p>
  </div>
</body>
</html>
